name: sdd-check
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Arquivos gerados em dia
        run: |
          python3 tools/sdd/generate.py --check || {
            echo "::error title=Arquivos gerados desatualizados::rode \`make docs\` e faça commit"
            exit 1
          }
      - name: Verificar especificações (mesmo comando do dev)
        run: make verify
