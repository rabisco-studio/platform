name: pages
# Site de pré-visualização (tools/sdd/build_site.py) no GitHub Pages. Deploy SOMENTE a partir da main.
# Só roda quando a variável PAGES_ENABLED for "true" (Settings → Secrets and variables → Actions → Variables),
# depois que o Pages foi habilitado em Settings → Pages → Source: GitHub Actions. Veja github-setup.md.
on:
  push:
    branches: [main]
    paths:
      - '.ai/sdd/**'
      - 'docs/**'
      - 'README.md'
      - 'tools/sdd/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desativado:
    if: vars.PAGES_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo '::notice::Pages desativado (variável PAGES_ENABLED diferente de true); nada foi publicado. Veja docs/governance/github-setup.md, seção 10.'

  build:
    if: vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Gerar o site
        run: python3 tools/sdd/build_site.py --out _site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publicar
      id-token: write   # verificação de origem do deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
